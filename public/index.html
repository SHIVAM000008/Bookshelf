<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookshelf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="4.2" height="16" rx="1.2"></rect>
        <rect x="9" y="4" width="4.2" height="16" rx="1.2"></rect>
        <rect x="15.3" y="5" width="4.2" height="15" rx="1.2" transform="rotate(-12 17.4 12.5)"></rect>
      </svg>
      <span>Bookshelf</span>
    </h1>

    <div class="account">
      <span class="avatar" id="user-avatar" aria-hidden="true"></span>
      <span class="account-name" id="user-name"></span>
      <span class="chip hidden" id="user-role">Admin</span>
      <button type="button" id="logout-btn" class="btn btn-ghost btn-sm">Log out</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title">Add a book</h2>

        <form id="book-form" class="stack">
          <input type="hidden" id="book-id">

          <div class="field">
            <label for="title">Title</label>
            <input type="text" id="title" required>
          </div>

          <div class="field">
            <label for="author">Author</label>
            <input type="text" id="author" required>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="genre">Genre</label>
              <input type="text" id="genre" placeholder="Fantasy">
            </div>
            <div class="field">
              <label for="year">Year</label>
              <input type="number" id="year" min="0" placeholder="2018">
            </div>
          </div>

          <div class="field">
            <label for="status">Status</label>
            <select id="status">
              <option value="to-read">To read</option>
              <option value="reading">Reading</option>
              <option value="finished">Finished</option>
            </select>
          </div>

          <p id="message" class="form-error" role="alert"></p>

          <div class="form-actions">
            <button type="submit" id="save-btn" class="btn btn-primary">Add book</button>
            <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Cancel</button>
          </div>
        </form>
      </section>
    </aside>

    <section class="content">
      <div class="panel">
        <div class="list-head">
          <div>
            <h2 id="list-title">Your library</h2>
            <p id="book-count" class="muted"></p>
          </div>
          <input type="search" id="search" class="search-field" placeholder="Search title or author" aria-label="Search books">
        </div>

        <div class="segmented" id="filter" role="group" aria-label="Filter by status">
          <button type="button" class="seg active" data-status="" aria-pressed="true">All</button>
          <button type="button" class="seg" data-status="to-read" aria-pressed="false">To read</button>
          <button type="button" class="seg" data-status="reading" aria-pressed="false">Reading</button>
          <button type="button" class="seg" data-status="finished" aria-pressed="false">Finished</button>
        </div>

        <ul id="book-list" class="book-list"></ul>
      </div>

      <div class="panel hidden" id="admin-panel">
        <h2>All users</h2>
        <ul id="user-list" class="user-list"></ul>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
